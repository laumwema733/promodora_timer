<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Promodern timer</title>
  </head>
  <body>
    <div class="board">
      <div class="clock">
        <p><span>25</span>:<span>00</span></p>
      </div>

      <div class="controller">
        <button>Start</button>
        <button>Pause</button>
        <button>Reset</button>
      </div>
      <div class="info">
        <p>Focus Timer</p>
        <p>
          <span>Cycles completed</span>
          <span>0</span>
        </p>
      </div>
    </div>
  </body>
</html>
