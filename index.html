<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="app.js"></script>
    <title>Pomodoro Timer</title>
  </head>
  <body>
    <div class="board">
      <div class="clock">
        <p class="time"><span>25</span>:<span>00</span></p>
      </div>

      <div class="controller">
        <button class="btn btn-start" id="start">Start</button>
        <button class="btn btn-pause" id="pause">Pause</button>
        <button class="btn btn-reset" id="reset">Reset</button>
      </div>
      <div class="status">
        <p class="info">Focus Time</p>
        <p>
          <span>Cycle completed: </span>
          <span class="cycle">0</span>
        </p>
      </div>
    </div>
  </body>
</html>
